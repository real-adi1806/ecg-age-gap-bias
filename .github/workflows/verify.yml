name: verify

# Two jobs on purpose.
#
# `checks` runs on every push. It needs no data, finishes in seconds, and covers
# the things that break silently: repository hygiene, and whether the code still
# runs on the oldest Python the README claims support for.
#
# `reproduce` downloads the 35.5 MB dataset and runs the whole analysis, so it
# is on a weekly schedule and a manual trigger rather than on every push. There
# is no reason to fetch a public archive on every commit, and a reproducibility
# claim that is only tested once is not a claim.

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Runners are pinned to ubuntu-24.04: ubuntu-latest moved to 26.04 in November 2026,
# which has no Python 3.9 build, and the oldest supported Python is part of what is tested.

permissions:
  contents: read

jobs:
  checks:
    name: hygiene and python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: repository hygiene
        run: python verify.py --hygiene
      - name: every module imports and compiles
        run: |
          python -m compileall -q .
          python -c "import ecg_age_bias, cox_model, verify; print('imports ok')"
      - name: germany numbers against its committed results
        run: python germany/verify_germany.py

  reproduce:
    name: full reproduce from the published data
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: download, checksum and analyse
        run: python ecg_age_bias.py
      - name: assert every number quoted in README.md
        run: python verify.py
      - name: keep the machine-readable results
        uses: actions/upload-artifact@v7
        with:
          name: results
          path: results/*.json
