<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui, sans-serif" font-size="13">
<rect width="720" height="420" fill="#ffffff"/>
<text x="70" y="28" font-size="16" font-weight="600">Share who died, by AI ECG age gap group, before and after correcting for age</text>
<text x="70" y="48" fill="#444">CODE-15%, n = 233,647 patients. Whiskers are 95% intervals.</text>
<line x1="70" x2="690" y1="330.0" y2="330.0" stroke="#e5e5e5"/>
<text x="62" y="334.0" text-anchor="end" fill="#444">0%</text>
<line x1="70" x2="690" y1="286.7" y2="286.7" stroke="#e5e5e5"/>
<text x="62" y="290.7" text-anchor="end" fill="#444">1%</text>
<line x1="70" x2="690" y1="243.3" y2="243.3" stroke="#e5e5e5"/>
<text x="62" y="247.3" text-anchor="end" fill="#444">2%</text>
<line x1="70" x2="690" y1="200.0" y2="200.0" stroke="#e5e5e5"/>
<text x="62" y="204.0" text-anchor="end" fill="#444">3%</text>
<line x1="70" x2="690" y1="156.7" y2="156.7" stroke="#e5e5e5"/>
<text x="62" y="160.7" text-anchor="end" fill="#444">4%</text>
<line x1="70" x2="690" y1="113.3" y2="113.3" stroke="#e5e5e5"/>
<text x="62" y="117.3" text-anchor="end" fill="#444">5%</text>
<line x1="70" x2="690" y1="70.0" y2="70.0" stroke="#e5e5e5"/>
<text x="62" y="74.0" text-anchor="end" fill="#444">6%</text>
<text x="230" y="366" text-anchor="middle" font-weight="600">Raw gap</text>
<rect x="168" y="199.2" width="56" height="130.8" fill="#c2410c"/>
<line x1="196.0" x2="196.0" y1="205.2" y2="193.0" stroke="#111"/>
<text x="196.0" y="187.0" text-anchor="middle" font-weight="600">3.02%</text>
<text x="196.0" y="346" text-anchor="middle" fill="#444" font-size="11">age 42.2</text>
<rect x="236" y="131.8" width="56" height="198.2" fill="#1d4ed8"/>
<line x1="264.0" x2="264.0" y1="140.2" y2="123.1" stroke="#111"/>
<text x="264.0" y="117.1" text-anchor="middle" font-weight="600">4.57%</text>
<text x="264.0" y="346" text-anchor="middle" fill="#444" font-size="11">age 62.9</text>
<text x="520" y="366" text-anchor="middle" font-weight="600">Corrected for age</text>
<rect x="458" y="107.1" width="56" height="222.9" fill="#c2410c"/>
<line x1="486.0" x2="486.0" y1="115.6" y2="98.3" stroke="#111"/>
<text x="486.0" y="92.3" text-anchor="middle" font-weight="600">5.14%</text>
<text x="486.0" y="346" text-anchor="middle" fill="#444" font-size="11">age 52.7</text>
<rect x="526" y="218.8" width="56" height="111.2" fill="#1d4ed8"/>
<line x1="554.0" x2="554.0" y1="224.8" y2="212.5" stroke="#111"/>
<text x="554.0" y="206.5" text-anchor="middle" font-weight="600">2.57%</text>
<text x="554.0" y="346" text-anchor="middle" fill="#444" font-size="11">age 52.2</text>
<line x1="70" x2="690" y1="330" y2="330" stroke="#111"/>
<rect x="70" y="398" width="12" height="12" fill="#c2410c"/>
<text x="88" y="408">older-looking (gap &gt; +8 y)</text>
<rect x="330" y="398" width="12" height="12" fill="#1d4ed8"/>
<text x="348" y="408">younger-looking (gap &lt; -8 y)</text>
<text x="690" y="382" text-anchor="end" fill="#444" font-size="11">age under each bar = group mean chronological age</text>
</svg>
